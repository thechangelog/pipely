name: 'Ship It!'

on:
  push:
    branches:
      - main
    tags:
      - 'v**'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

# Alternate runners provide resiliency for checks, not automatic release replay.
jobs:
  # In thechangelog/pipely repository (a.k.a. upstream),
  # this is the preferred default (i.e. custom runners, faster than GitHub):
  on-namespace:
    if: ${{ contains(vars.RUNS_ON, 'namespace') }}
    uses: ./.github/workflows/_namespace.yml
    secrets: inherit

  # Release failures may occur after publish/deploy/PURGE. Inspect before recovery;
  # never replay the entire release automatically on another runner.
  on-github-fallback:
    needs: on-namespace
    if: ${{ failure() && !(startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push') }}
    uses: ./.github/workflows/_github.yml
    secrets: inherit

  # As forks will not have access to our Namespace.so custom runners,
  # we fallback to the default GitHub free runners:
  on-github:
    if: ${{ !contains(vars.RUNS_ON, 'namespace') }}
    uses: ./.github/workflows/_github.yml
    secrets: inherit
